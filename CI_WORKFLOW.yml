# Move this file to .github/workflows/qa.yml in GitHub.
name: QA
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r api-tests/requirements.txt
      - run: pytest -q api-tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd web-tests && npm ci
      - run: cd web-tests && npx playwright install --with-deps chromium
      - run: cd web-tests && npx playwright test
